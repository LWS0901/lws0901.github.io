<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wonseok Lee, Digital Heritage Portfolio</title>
<meta name="description" content="Wonseok Lee — digital heritage researcher: knowledge graphs, semantic archives, spatial analysis and computer vision for cultural heritage.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#111111; --canvas:#ffffff; --cloud:#f5f5f5; --hairline:#cacacb; --hairline-soft:#e5e5e5;
    --charcoal:#39393b; --ash:#4b4b4d; --mute:#707072; --stone:#9e9ea0;
    --teal:#0a7281; --purple:#beaffd; --info:#1151ff;
    --display:"Anton","Bebas Neue","Noto Sans KR",Impact,sans-serif;
    --sans:"Inter","Noto Sans KR","Helvetica Neue",Helvetica,Arial,sans-serif;
    --gap:8px; --ease:cubic-bezier(.2,.7,.1,1);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:var(--sans);background:var(--canvas);color:var(--ink);line-height:1.5;font-size:16px;-webkit-font-smoothing:antialiased;overflow:hidden}
  a{color:inherit;text-decoration:none}
  button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
  ::selection{background:var(--ink);color:#fff}

  /* ---------- app shell: one screen, no page scroll ---------- */
  .app{height:100vh;height:100dvh;display:grid;grid-template-rows:60px 1fr 36px}
  .bar{display:flex;align-items:center;gap:24px;padding:0 24px;box-shadow:inset 0 -1px 0 var(--hairline-soft)}
  .logo{font-family:var(--display);font-size:24px;text-transform:uppercase;line-height:1;letter-spacing:.01em}
  .bar nav{margin:0 auto}
  .tabs{display:flex;gap:4px;list-style:none}
  .tabs button{height:60px;padding:0 14px;font-weight:500;font-size:15px;display:flex;align-items:center;gap:6px;border-bottom:2px solid transparent;color:var(--mute);transition:color .2s}
  .tabs button small{font-size:11px;color:var(--stone);font-weight:500}
  .tabs button:hover{color:var(--ink)}
  .tabs button.on{color:var(--ink);border-color:var(--ink)}
  .search-pill{height:40px;padding:0 8px 0 16px;border-radius:24px;background:var(--cloud);display:flex;align-items:center;gap:24px;font-size:14px;color:var(--mute);font-weight:500;white-space:nowrap}
  .search-pill kbd{font:inherit;font-size:11px;background:#fff;border-radius:12px;padding:3px 9px;color:var(--ink)}
  .pill{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 28px;border-radius:30px;background:var(--ink);color:#fff;font-weight:500;font-size:16px;white-space:nowrap;transition:transform .12s,opacity .12s;cursor:pointer}
  .pill:active{transform:scale(.92);opacity:.6}
  .pill.sm{height:40px;padding:0 20px;font-size:14px}
  .pill.soft{background:var(--cloud);color:var(--ink)}
  .pill.white{background:#fff;color:var(--ink)}
  .pill.line{background:transparent;color:#fff;box-shadow:inset 0 0 0 1px var(--ash)}
  .pill.line-dark{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1px var(--hairline)}
  .circ{width:40px;height:40px;border-radius:50%;background:var(--cloud);display:inline-flex;align-items:center;justify-content:center;font-size:18px;transition:transform .12s}
  .circ:active{transform:scale(.85)}

  .status{display:flex;align-items:center;gap:20px;padding:0 24px;font-size:12px;font-weight:500;color:var(--mute);box-shadow:inset 0 1px 0 var(--hairline-soft);background:var(--cloud)}
  .status .keys{display:flex;gap:16px}
  .status kbd{font:inherit;background:#fff;border:1px solid var(--hairline);border-radius:4px;padding:0 5px;color:var(--ink);font-size:11px}
  .status .right{margin-left:auto;display:flex;gap:16px}
  .live{display:inline-flex;align-items:center;gap:6px}
  .live::before{content:"";width:8px;height:8px;border-radius:50%;background:#1eaa52;animation:pulse 2s infinite}
  @keyframes pulse{50%{opacity:.3}}

  /* ---------- views ---------- */
  .stage{position:relative;overflow:hidden}
  .view{position:absolute;inset:0;padding:var(--gap);opacity:0;visibility:hidden;transform:translateY(16px);transition:opacity .45s var(--ease),transform .45s var(--ease),visibility 0s .45s}
  .view.on{opacity:1;visibility:visible;transform:none;transition:opacity .45s var(--ease),transform .45s var(--ease)}

  /* home bento */
  .bento{height:100%;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:1fr 1fr .9fr;gap:var(--gap)}
  .tile{position:relative;overflow:hidden;background:var(--cloud);padding:28px;display:flex;flex-direction:column;cursor:pointer}
  .tile .lbl{font-size:12px;font-weight:500;color:var(--mute);display:flex;justify-content:space-between;align-items:center;position:relative;z-index:2}
  .tile .lbl .arrow{width:32px;height:32px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;color:var(--ink);transition:transform .3s var(--ease)}
  .tile:hover .lbl .arrow{transform:rotate(-45deg)}
  .t-hero{grid-column:1/4;grid-row:1/3;background:var(--ink);color:#fff;justify-content:flex-end;cursor:default}
  .t-hero .lbl{color:var(--stone)}
  .t-hero .ghost{position:absolute;right:-3%;top:-12%;font-family:var(--display);font-size:min(42vw,62vh);line-height:.8;color:#1c1c1d;pointer-events:none;user-select:none;transition:transform .6s var(--ease)}
  .t-hero .lbl{position:absolute;top:28px;left:28px;right:28px}
  .t-hero h1{position:relative;font-family:var(--display);font-weight:400;font-size:clamp(48px,7.4vw,128px);line-height:.9;text-transform:uppercase}
  .swap{display:inline-block;position:relative;color:#fff}
  .swap span{display:inline-block;animation:rise .6s var(--ease)}
  .swap::after{content:"";position:absolute;left:0;right:0;bottom:-.14em;height:.06em;background:#fff;transform-origin:left;animation:line 2.6s linear infinite}
  @keyframes rise{from{transform:translateY(60%);opacity:0}}
  @keyframes line{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  .t-hero p{position:relative;margin:20px 0 26px;max-width:620px;color:#e5e5e5;font-size:20px;font-weight:500}
  .t-hero .cta{position:relative;display:flex;gap:10px;flex-wrap:wrap}
  .t-graph{grid-column:4;grid-row:1/3;padding:0}
  .t-graph .lbl{position:absolute;top:24px;left:24px;right:24px}
  .t-graph svg{width:100%;height:100%;display:block}
  .t-graph .cap{position:absolute;left:24px;bottom:22px;z-index:2}
  .t-graph .cap b{font-family:var(--display);font-weight:400;font-size:44px;line-height:.9;display:block;text-transform:uppercase}
  .t-graph .cap span{font-size:13px;color:var(--mute);font-weight:500}
  .t-stats{grid-column:1;grid-row:3;justify-content:space-between}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .stats b{font-family:var(--display);font-weight:400;font-size:clamp(40px,4.4vw,72px);line-height:.9;display:block}
  .t-stats .stats{margin-bottom:9%}
  .stats span{font-size:12px;color:var(--mute);font-weight:500}
  .t-latest{grid-column:2/4;grid-row:3;flex-direction:row;gap:24px;align-items:stretch}
  .t-latest{position:relative}
  .t-latest h3{padding-right:34%;font-size:18px}
  #relic{position:absolute;right:9%;top:20%;bottom:7%;width:28%;pointer-events:none}
  #relic svg{width:100%;height:100%;overflow:visible;transition:opacity .8s ease}
  #relic path{fill:none;stroke:#1f1f1f;stroke-width:1.15;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke;opacity:.82}
  #relic path.g{stroke-width:.8;opacity:.45}
  #relic.out svg{opacity:0}
  #relic[data-kind="jongmyo"]{width:38%;right:5%;top:26%;bottom:18%}
  #relic[data-kind="jongmyo"] svg{overflow:hidden}
  .t-latest .num{font-family:var(--display);font-size:clamp(90px,10vw,170px);line-height:.8;align-self:flex-end;transition:transform .5s var(--ease)}
  .t-latest:hover .num{transform:translateY(-6px) scale(1.04)}
  .t-latest .txt{display:flex;flex-direction:column;flex:1;min-width:0}
  .t-latest h3{font-size:20px;font-weight:500;margin-top:auto;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .t-latest p{font-size:14px;color:var(--charcoal);margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .t-latest .dots{margin-top:10px}
  .t-now{grid-column:4;grid-row:3;background:#fff;box-shadow:inset 0 0 0 1px var(--hairline);justify-content:space-between}
  .nowbig{font-family:var(--display);font-size:clamp(64px,6.4vw,112px);line-height:.82;color:var(--ink,#111);letter-spacing:0;display:inline-flex;align-items:flex-start;gap:8px;-webkit-text-stroke:2.4px #fff}
  .nowbig i{width:10px;height:10px;border-radius:50%;background:#111;margin-top:6px;animation:nowpulse 1.6s ease-in-out infinite}
  @keyframes nowpulse{0%,100%{opacity:1}50%{opacity:.15}}
  .t-now h3{font-size:20px;font-weight:500;line-height:1.3}
  .t-now .sub{font-size:13px;color:var(--mute);font-weight:500}

  .dots{display:flex;gap:6px}
  .dots i{width:12px;height:12px;border-radius:50%;background:var(--teal)}
  .dots i.t{background:#fff;box-shadow:inset 0 0 0 1px var(--hairline)}

  /* work: index list + preview (PDP-like) */
  .work{height:100%;display:grid;grid-template-columns:minmax(340px,1fr) 1.35fr;gap:var(--gap)}
  .w-list{display:flex;flex-direction:column;min-height:0;padding:20px 20px 0}
  .filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:16px;scrollbar-width:none;flex:none}
  .filters button{flex:none;height:36px;padding:0 14px;border-radius:30px;box-shadow:inset 0 0 0 1px var(--hairline);font-weight:500;font-size:13px;white-space:nowrap}
  .filters button.on{background:var(--ink);color:#fff;box-shadow:none}
  .rows{list-style:none;overflow-y:auto;flex:1;border-top:1px solid var(--hairline)}
  .rows li button{width:100%;display:grid;grid-template-columns:56px 1fr auto;align-items:center;gap:12px;text-align:left;padding:18px 4px;border-bottom:1px solid var(--hairline-soft);transition:padding .3s var(--ease),background .2s}
  .rows li button .n{font-family:var(--display);font-size:28px;line-height:1;color:var(--stone);transition:color .2s}
  .rows li button .ti{font-weight:500;font-size:16px;line-height:1.35}
  .rows li button .su{display:block;font-size:13px;color:var(--mute);font-weight:500}
  .rows li button .su span+span::before,.w-info .th span+span::before{content:"";display:inline-block;width:4px;height:4px;border-radius:50%;background:var(--stone);margin:0 8px;vertical-align:middle}
  .w-visual .badges{position:absolute;top:20px;left:20px;display:flex;gap:6px;flex-wrap:wrap;max-width:70%}
  .w-visual .badges .badge{position:static}
  .w-visual .badges .badge.dark{background:var(--ink);color:#fff;box-shadow:none}
  .cvlist li.cvhead{display:block;font-size:12px;color:var(--mute);padding:20px 0 6px;border-bottom:1px solid var(--hairline)}
  .cvlist .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
  .cvlist .chips em{font-style:normal;font-size:12px;font-weight:500;padding:3px 10px;border-radius:30px;box-shadow:inset 0 0 0 1px var(--hairline)}
  .w-info .outs{grid-column:1/-1;list-style:none;border-top:1px solid var(--hairline-soft);margin-top:4px}
  .w-info .outs li{display:grid;grid-template-columns:150px 1fr;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--hairline-soft);font-size:14px;font-weight:500}
  .w-info .outs .k{font-size:12px;color:var(--mute)}
  .w-info .outs em{display:block;font-style:normal;font-size:12px;color:var(--mute);font-weight:400}
  .rows li.grp{font-size:12px;font-weight:500;color:var(--mute);padding:20px 4px 8px;border-bottom:1px solid var(--hairline);text-transform:none;letter-spacing:.02em}
  .rows li.grp:first-child{padding-top:8px}
  .rows li button .st{display:inline-block;font-size:11px;background:var(--ink);color:#fff;border-radius:30px;padding:1px 8px;margin-right:8px}
  .rows li button .yr{font-size:13px;font-weight:500;color:var(--mute)}
  .rows li button:hover,.rows li button.on{padding-left:14px}
  .rows li button.on{background:var(--cloud)}
  .rows li button:hover .n,.rows li button.on .n{color:var(--ink)}
  .w-detail{background:var(--cloud);position:relative;overflow:hidden;display:grid;grid-template-rows:1fr auto}
  .w-visual{position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;min-height:0}
  .w-visual .big{font-family:var(--display);font-size:min(30vw,40vh);line-height:.8;transition:transform .7s var(--ease)}
  .w-visual .badge{position:absolute;top:20px;left:20px;background:#fff;box-shadow:inset 0 0 0 1px var(--hairline);border-radius:30px;padding:4px 12px;font-size:12px;font-weight:500}
  .w-visual .nav{position:absolute;top:16px;right:16px;display:flex;gap:8px}
  .w-visual .nav .circ{background:#fff}
  .w-visual .yr{position:absolute;right:20px;bottom:16px;z-index:2;background:var(--cloud);padding:2px 0 0 10px;font-family:var(--display);font-size:32px}
  .w-visual .mini-net{position:absolute;inset:0;width:100%;height:100%;opacity:.9;pointer-events:none}
  .w-info{background:#fff;padding:24px 28px;display:grid;grid-template-columns:1fr auto;gap:8px 24px;align-items:end}
  .w-info h2{font-size:24px;font-weight:500;line-height:1.2}
  .w-info .sub{font-size:14px;color:var(--mute);font-weight:500;margin-top:4px}
  .w-info p{grid-column:1/-1;font-size:15px;color:var(--charcoal)}
  .w-info .tools{grid-column:1;display:flex;gap:8px;flex-wrap:wrap}
  .w-info .tools span{font-size:12px;font-weight:500;padding:4px 12px;border-radius:30px;box-shadow:inset 0 0 0 1px var(--hairline)}
  .w-info .acts{grid-column:2;grid-row:1/3;display:flex;gap:8px;align-self:start}
  .swapin{animation:swapin .5s var(--ease)}
  .swapin.rise{animation:swapin .55s var(--ease) both}
  @keyframes swapin{from{opacity:0;transform:translateY(14px)}}

  /* graph */
  .graph-box{height:100%;display:grid;grid-template-columns:1fr;position:relative}
  .g-canvas{position:relative;background:var(--cloud);overflow:hidden}
  .g-canvas svg{width:100%;height:100%;display:block;cursor:grab}
  .g-canvas svg:active{cursor:grabbing}
  .g-canvas .zoom{position:absolute;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px}
  .g-canvas .zoom .circ{background:#fff}
  .g-canvas .g-tools{position:absolute;left:20px;bottom:18px;display:flex;flex-direction:column;align-items:flex-start;gap:8px;max-width:calc(100% - 100px)}
  .g-canvas .g-tools input{border:none;outline:none;font:inherit;font-size:12px;height:30px;width:200px;padding:0 14px;border-radius:30px;background:#fff;box-shadow:inset 0 0 0 1px var(--hairline)}
  .g-canvas .g-tools .legend{gap:6px}
  .g-canvas .g-tools .legend label{height:26px;font-size:11px;padding:0 10px;gap:6px;background:#fff}
  .g-canvas .g-tools .legend .dot{width:8px;height:8px}
  .g-canvas .ttl{position:absolute;left:24px;top:20px;pointer-events:none}
  .g-canvas .ttl b{font-family:var(--display);font-weight:400;font-size:56px;line-height:.9;text-transform:uppercase;display:block}
  .g-canvas .ttl span{font-size:13px;color:var(--mute);font-weight:500}
  .link{stroke:#cacacb;stroke-width:1;transition:stroke .2s,opacity .2s}
  .link.hl{stroke:var(--ink);stroke-width:2}
  .node circle{stroke:var(--cloud);stroke-width:2;cursor:pointer;transition:r .2s}
  .node:hover circle{stroke:var(--ink)}
  .node text{font-family:var(--sans);font-size:11.5px;font-weight:500;fill:var(--ink);pointer-events:none;paint-order:stroke;stroke:var(--cloud);stroke-width:3px;stroke-linejoin:round}
  .node{transition:opacity .25s}
  .node.dim{opacity:.12}
  .link.dim{opacity:.06}
  .node.sel circle{stroke:var(--ink);stroke-width:3}
  .mini .node text{display:none}
  .mini .node circle{cursor:default}
  .panel{padding:20px;overflow:auto;display:flex;flex-direction:column;gap:18px;box-shadow:inset 0 0 0 1px var(--hairline-soft)}
  .graph-box .panel{position:absolute;right:16px;top:16px;width:320px;max-height:calc(100% - 200px);background:#fff;z-index:3}
  .graph-box .panel:has(.info:empty){display:none}
  .legend{display:flex;flex-wrap:wrap;gap:8px}
  .legend label{display:flex;align-items:center;gap:8px;height:34px;font-size:13px;font-weight:500;padding:0 14px;border-radius:30px;box-shadow:inset 0 0 0 1px var(--hairline);cursor:pointer;user-select:none;transition:opacity .2s}
  .legend label.off{opacity:.3}
  .dot{width:12px;height:12px;border-radius:50%;display:inline-block;flex:none}
  .info{border-top:1px solid var(--hairline);padding-top:18px}
  .info:empty{display:none}
  .info .type{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:500;color:var(--mute)}
  .info h4{font-size:22px;font-weight:500;line-height:1.25;margin:8px 0}
  .info p{font-size:14px;color:var(--charcoal)}
  .info ul{list-style:none;margin-top:14px}
  .info li button{width:100%;display:flex;align-items:center;gap:10px;text-align:left;border-bottom:1px solid var(--hairline-soft);padding:11px 0;font-size:14px;font-weight:500}
  .info li button::after{content:"›";margin-left:auto;font-size:18px;color:var(--mute)}
  .info li button:hover{padding-left:6px;transition:padding .2s}
  .info .rel{font-size:11px;color:var(--stone)}

  /* publications */
  .writing{height:100%;display:grid;grid-template-columns:minmax(280px,1fr) 2.4fr;gap:var(--gap)}
  .wr-side{background:var(--ink);color:#fff;padding:28px;display:flex;flex-direction:column;justify-content:space-between;gap:24px}
  .wr-side b{font-family:var(--display);font-weight:400;font-size:clamp(52px,6vw,104px);line-height:.9;text-transform:uppercase}
  .ptabs{display:flex;flex-direction:column}
  .ptabs button{display:flex;align-items:baseline;justify-content:space-between;padding:12px 0;border-bottom:1px solid #2a2a2b;color:var(--stone);font-weight:500;font-size:15px;text-align:left;transition:color .2s,padding .3s var(--ease)}
  .ptabs button span{font-family:var(--display);font-size:24px;font-weight:400}
  .ptabs button:hover{color:#fff}
  .ptabs button.on{color:#fff;padding-left:10px;border-color:#fff}
  .wr-main{display:flex;flex-direction:column;min-height:0}
  .wr-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 20px 16px;flex:none}
  .wr-head h3{font-size:24px;font-weight:500}
  .wr-head .me{font-size:12px;color:var(--mute);font-weight:500}
  .wr-list{list-style:none;overflow:auto;padding:0 20px;border-top:1px solid var(--hairline);flex:1}
  .wr-list li{display:grid;grid-template-columns:80px 1fr auto;gap:20px;align-items:start;padding:20px 0;border-bottom:1px solid var(--hairline)}
  .wr-list .y{font-family:var(--display);font-size:28px;line-height:1}
  .wr-list .y small{display:block;font-family:var(--sans);font-size:11px;font-weight:500;color:var(--mute);margin-top:6px}
  .wr-list .t{font-weight:500;font-size:16px;line-height:1.4}
  .wr-list .en{font-size:13px;color:var(--charcoal);margin-top:2px}
  .wr-list .au{font-size:13px;color:var(--mute);margin-top:6px}
  .wr-list .au b{color:var(--ink);font-weight:700;text-decoration:underline;text-underline-offset:3px}
  .wr-list .v{font-size:13px;color:var(--ink);font-weight:500;margin-top:2px}
  .wr-list .acts{display:flex;gap:6px;align-items:center}
  .wr-list .acts .pill{height:34px;padding:0 14px;font-size:13px}
  .wr-list .acts .circ{width:34px;height:34px;font-size:14px}
  .tag-forth{display:inline-block;font-size:11px;font-weight:500;background:var(--cloud);border-radius:30px;padding:2px 8px;margin-right:6px;vertical-align:2px}
  .wr-list li.sec{display:block;font-size:12px;font-weight:500;color:var(--mute);padding:18px 0 8px;border-bottom:1px solid var(--hairline)}
  .tag-forth.warn{background:#fff3cd;color:#7a5a00}
  .empty-st{padding:48px 0;color:var(--mute);font-size:14px}
  .toast{position:fixed;left:50%;bottom:56px;transform:translate(-50%,20px);background:var(--ink);color:#fff;border-radius:30px;padding:12px 22px;font-size:14px;font-weight:500;opacity:0;pointer-events:none;transition:all .3s var(--ease);z-index:70}
  .toast.on{opacity:1;transform:translate(-50%,0)}

  /* about / CV */
  .about{height:100%;display:grid;grid-template-columns:1.2fr 1fr;grid-template-rows:1fr auto;gap:var(--gap)}
  .ab-main{grid-row:1/3;background:var(--cloud);padding:32px 36px;display:flex;flex-direction:column;gap:20px;overflow:auto}
  .ab-top{display:flex;justify-content:space-between;align-items:flex-start;gap:24px}
  .portrait{margin:0;flex:none;width:clamp(150px,15vw,240px);aspect-ratio:1;overflow:hidden;background:#111}
  .portrait img{width:100%;height:100%;object-fit:cover;display:block;filter:saturate(.78);transition:transform .8s var(--ease)}
  .portrait:hover img{transform:scale(1.04)}
  .ab-main b.big{font-family:var(--display);font-weight:400;font-size:clamp(56px,6.4vw,108px);line-height:.9;text-transform:uppercase}
  .ab-id{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;font-weight:500}
  .ab-id .nm{font-size:20px}
  .ab-id .ps{font-size:14px;color:var(--mute)}
  .seg{display:inline-flex;background:#fff;border-radius:30px;padding:4px;gap:2px;align-self:flex-start}
  .seg button{height:32px;padding:0 16px;border-radius:30px;font-size:13px;font-weight:500;color:var(--mute)}
  .seg button.on{background:var(--ink);color:#fff}
  .bio{font-size:16.5px;line-height:1.7;max-width:680px}
  .bio.swapin{animation:swapin .4s var(--ease)}
  .ab-links{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto}
  .about>*{min-width:0}
  .cvtabs{scrollbar-width:none}
  .cvbox .cvtabs button{flex:1 0 auto;padding:0 8px;font-size:13px}
  .cvbox{box-shadow:inset 0 0 0 1px var(--hairline);display:flex;flex-direction:column;min-height:0}
  .cvtabs{display:flex;box-shadow:inset 0 -1px 0 var(--hairline-soft);flex:none;overflow-x:auto}
  .cvtabs button{flex:1;height:52px;font-size:14px;font-weight:500;color:var(--mute);border-bottom:2px solid transparent;white-space:nowrap;padding:0 12px}
  .cvtabs button.on{color:var(--ink);border-color:var(--ink)}
  .cvlist{list-style:none;padding:4px 24px;overflow:auto;flex:1}
  .cvlist li{display:grid;grid-template-columns:140px 1fr;gap:12px;padding:16px 0;border-bottom:1px solid var(--hairline-soft);font-weight:500;font-size:15px}
  .cvlist li:last-child{border-bottom:none}
  .cvlist .yr{color:var(--mute);font-size:13px}
  .cvlist .sub{display:block;font-size:13px;color:var(--mute)}
  .areas{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--gap)}
  .area{background:var(--ink);color:#fff;padding:20px;min-height:170px;display:flex;flex-direction:column;cursor:default;transition:background .3s}
  .area .ico{font-family:var(--display);font-size:44px;line-height:.9;margin-bottom:auto}
  .area h3{font-size:22px;font-weight:600;margin-top:14px}
  .area p{font-size:12.5px;color:var(--stone);max-height:0;overflow:hidden;transition:max-height .4s var(--ease),margin .4s}
  .area:hover{background:var(--charcoal)}
  .area:hover p{max-height:90px;margin-top:6px}

  /* command palette */
  .cmdk{position:fixed;inset:0;z-index:50;background:rgba(17,17,17,.4);display:none;align-items:flex-start;justify-content:center;padding-top:12vh}
  .cmdk.on{display:flex}
  .cmdk .box{width:min(620px,92vw);background:#fff;animation:swapin .3s var(--ease)}
  .cmdk input{width:100%;height:64px;border:none;outline:none;padding:0 24px;font:inherit;font-size:18px;box-shadow:inset 0 -1px 0 var(--hairline)}
  .cmdk ul{list-style:none;max-height:50vh;overflow:auto;padding:8px}
  .cmdk li button{width:100%;display:flex;align-items:center;gap:12px;padding:12px 16px;text-align:left;font-size:15px;font-weight:500;border-radius:30px}
  .cmdk li button .k{margin-left:auto;font-size:12px;color:var(--mute)}
  .cmdk li button.on{background:var(--cloud)}
  .cmdk .empty{padding:24px;color:var(--mute);font-size:14px}

  /* cursor follower */
  .cursor{position:fixed;left:0;top:0;width:10px;height:10px;border-radius:50%;background:var(--ink);pointer-events:none;z-index:60;mix-blend-mode:difference;background:#fff;transform:translate(-50%,-50%);transition:width .25s var(--ease),height .25s var(--ease)}
  .cursor.big{width:44px;height:44px}
  @media (hover:none){.cursor{display:none}}

  /* ---------- responsive: allow scroll on small screens ---------- */
  @media (max-width:1100px){
    .bento{grid-template-columns:repeat(2,1fr);grid-template-rows:auto;height:auto}
    .t-hero{grid-column:1/3;grid-row:auto;min-height:440px}
    .t-graph{grid-column:1/3;grid-row:auto;min-height:320px}
    .t-stats,.t-now{grid-column:auto;grid-row:auto;min-height:200px}
    .t-latest{grid-column:1/3;grid-row:auto;min-height:200px}
    .view{overflow-y:auto}
  }
  @media (max-width:860px){
    .tabs button small,.search-pill span{display:none}
    .tabs{position:fixed;bottom:0;left:0;right:0;z-index:30;background:#fff;justify-content:space-around;box-shadow:inset 0 1px 0 var(--hairline-soft)}
    .tabs button{height:56px;font-size:13px;padding:0 8px}
    .app{grid-template-rows:60px 1fr 56px}
    .status{display:none}
    .bar .pill{display:none}
    .work,.graph-box,.writing,.about{grid-template-columns:1fr;grid-template-rows:auto;height:auto}
    .w-detail{min-height:0;order:-1;grid-template-rows:auto auto}
    .w-visual{height:240px}
    .w-visual .big{font-size:150px}
    .w-visual .yr{font-size:24px}
    .g-canvas{height:60vh}
    .wr-side{min-height:220px}
    .ab-main{grid-row:auto}
    .areas{grid-template-columns:1fr}
    .wr-list li{grid-template-columns:56px 1fr}.wr-list .acts{grid-column:2;flex-wrap:wrap}.cvlist li{grid-template-columns:1fr;gap:2px}
    .t-hero,.t-graph,.t-stats,.t-latest,.t-now{grid-column:1/3}
  }
  .motto{font-family:var(--display);font-size:clamp(22px,2.2vw,32px);line-height:1;text-transform:uppercase;letter-spacing:.01em}
  .dual{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
  .dual span{height:34px;display:inline-flex;align-items:center;padding:0 16px;border-radius:30px;background:var(--ink);color:#fff;font-size:13px;font-weight:500}
  .dual i{font-style:normal;color:var(--mute);font-weight:500}
  .seg.lang{background:var(--cloud);flex:none;align-self:center}
  .seg.lang button{height:32px;padding:0 12px}
  @media (max-width:860px){ .seg.lang button{padding:0 9px} }
</style>
</head>
<body>
<div class="app">
  <header class="bar">
    <a href="#home" class="logo" data-go="home">Wonseok Lee</a>
    <nav><ul class="tabs" id="tabs"></ul></nav>
    <div class="seg lang" id="lang"><button data-l="en">EN</button><button data-l="ko">KR</button></div>
    <button class="search-pill" id="open-cmdk"><span data-i18n="search">Search</span><kbd>⌘K</kbd></button>
    <a class="pill sm" href="#about" data-go="about" data-i18n="contact">Contact</a>
  </header>

  <main class="stage" id="stage">
    <!-- 01 HOME -->
    <section class="view" id="v-home">
      <div class="bento">
        <div class="tile t-hero" id="hero">
          <div class="ghost" id="ghost">DH</div>
          
          <h1>Read heritage<br>as <span class="swap" id="swap"><span>data.</span></span></h1>
          <p data-i18n="heroP"></p>
          <div class="cta"><button class="pill white" data-go="work" data-i18n="ctaWork"></button><button class="pill line" data-go="writing" data-i18n="ctaPubs"></button></div>
        </div>
        <div class="tile t-graph" data-go="graph">
          <div class="lbl"><span></span><span class="arrow">→</span></div>
          <svg id="mini-graph" class="mini"></svg>
          <div class="cap"><b>Research<br>Map</b></div>
        </div>
        <div class="tile t-stats" data-go="writing">
          <div class="lbl"><span></span><span class="arrow">→</span></div>
          <div class="stats" id="stats"></div>
        </div>
        <div class="tile t-latest" id="latest">
          <div id="relic"></div>
          <div class="num" id="latest-num">01</div>
          <div class="txt">
            <div class="lbl"><span></span><span class="arrow">→</span></div>
            <h3 id="latest-title"></h3>
          </div>
        </div>
        <a class="tile t-now" href="https://hilab.quv.kr" target="_blank" rel="noopener">
          <div class="lbl"><span class="nowbig">NOW<i></i></span><span class="arrow">↗</span></div>
          <div><h3 id="now-title"></h3><div class="sub" id="now-sub"></div></div>
        </a>
      </div>
    </section>

    <!-- 02 WORK -->
    <section class="view" id="v-work">
      <div class="work">
        <div class="w-list">
          <div class="filters" id="filters"></div>
          <ul class="rows" id="rows"></ul>
        </div>
        <div class="w-detail">
          <div class="w-visual" id="w-visual"></div>
          <div class="w-info" id="w-info"></div>
        </div>
      </div>
    </section>

    <!-- 03 MAP -->
    <section class="view" id="v-graph">
      <div class="graph-box">
        <div class="g-canvas">
          <svg id="graph"></svg>
          <div class="ttl"><b>Research<br>Map</b></div>
          <div class="zoom"><button class="circ" id="z-in">+</button><button class="circ" id="z-out">−</button><button class="circ" id="z-fit">⟲</button></div>
          <div class="g-tools"><input id="gsearch" data-i18n-ph="nodeSearch"><div class="legend" id="legend"></div></div>
        </div>
        <aside class="panel">
          <div class="info" id="info"></div>
        </aside>
      </div>
    </section>

    <!-- 04 PUBLICATIONS -->
    <section class="view" id="v-writing">
      <div class="writing">
        <div class="wr-side"><b>Publi&shy;cations</b><div class="ptabs" id="ptabs"></div></div>
        <div class="wr-main">
          <div class="wr-head"><h3 id="ptitle">All</h3></div>
          <ul class="wr-list" id="wr-list"></ul>
        </div>
      </div>
    </section>

    <!-- 05 ABOUT / CV -->
    <section class="view" id="v-about">
      <div class="about">

const pad = n => String(n).padStart(2,"0");

/* ---------------- router ---------------- */
const VIEWS = [["home","Index"],["work","Work"],["graph","Map"],["writing","Publications"],["about","About"]];
$("#tabs").innerHTML = VIEWS.map(([k,l],i)=>`<li><button data-go="${k}"><small>${pad(i+1)}</small>${l}</button></li>`).join("");
let current = null;
function go(v, opts={}){
  if(!VIEWS.some(x=>x[0]===v)) v="home";
  if(v===current && !opts.force) return;
  current = v;
  document.querySelectorAll(".view").forEach(el => el.classList.toggle("on", el.id==="v-"+v));
  document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("on", b.dataset.go===v));
  if(location.hash!=="#"+v) history.replaceState(null,"","#"+v);
  if(v==="graph") setTimeout(()=>G.resize(), 60);
  if(v==="home") countUp();
}
document.addEventListener("click", e => { const t = e.target.closest("[data-go]"); if(!t) return; e.preventDefault(); go(t.dataset.go); });

/* ---------------- HOME ---------------- */
function renderHome(){
  const latest = DATA.projects.find(p=>p.id===DATA.featured) || DATA.projects[0];

  const n=[DATA.projects.length, countType("article")+countType("conference"), countType("presentation")];
  $("#stats").innerHTML = n.map((v,i)=>`<div><b data-n="${v}">${pad(v)}</b><span>${U("stats")[i]}</span></div>`).join("");
}

  const nodes=[], links=[], byId={};
  const add=(id,type,label,desc)=>{ if(!byId[id]){ byId[id]={id,type,label,desc,x:0,y:0,vx:0,vy:0}; nodes.push(byId[id]); } };
  const link=(a,b,rel)=>links.push({source:byId[a],target:byId[b],rel});
  add("me","person",T(DATA.name),T(DATA.bio));
  DATA.projects.forEach(p=>{
    if(!p.themes.length) return;
    add(p.id,"project",T(p.title),T(p.desc));
    p.themes.forEach(t=>{ if(!byId["t:"+t]){ add("t:"+t,"topic",theme(t),""); link("me","t:"+t,U("theme")); } link(p.id,"t:"+t,U("theme")); });
  });
  DATA.publications.forEach((p,i)=>{ if(p.type==="essay"||p.type==="coursework") return; const id="pub"+i; add(id,"pub",T(p.title),`${U("kinds")[p.type]||""} — ${T(p.venue)}`); if(p.project&&byId[p.project]) link(p.project,id,U("project")); else link("me",id,U("kinds")[p.type]); });

    nodes.forEach((n,i)=>{

  }
  function setHidden(hidden){ nodes.forEach(n=>{ n.hidden=hidden.has(n.type); n.el.style.display=n.hidden?"none":""; }); links.forEach(l=>l.el.style.display=(l.source.hidden||l.target.hidden)?"none":""); fitted=false; reheat(.5); }
  function resize(){ W=svg.clientWidth; H=svg.clientHeight; fitted=false; reheat(.4); }
  applyView(); reheat(.5);
  return {select,resize,setHidden,nodes,kill:()=>{dead=true;},zoom:f=>zoomAt(f),fit:()=>autoFit(true)};
}
const hidden=new Set();
let G, M;
const infoDefault = () => "";
function onSelect(n,rel){
  if(!n){ $("#info").innerHTML=infoDefault(); return; }
  $("#info").innerHTML = `<div class="swapin"><div class="type"><span class="dot" style="background:${TYPES[n.type].color}"></span>${U("types")[n.type]} — ${rel.length} ${U("links")}</div>
    <h4>${esc(n.label)}</h4>
    ${n.type==="project"?`<button class="pill sm" style="margin-top:14px" data-open="${n.id}">${U("openProject")}</button>`:""}
    <ul>${rel.map(r=>`<li><button data-id="${esc(r.o.id)}"><span class="dot" style="background:${TYPES[r.o.type].color}"></span><span>${esc(r.o.label)}<br><span class="rel">${esc(r.rel)}</span></span></button></li>`).join("")}</ul></div>`;
}
function renderMap(){
  if(G) G.kill(); if(M) M.kill();
  G = createGraph($("#graph"),{onSelect}); G.setHidden(hidden);
  M = createGraph($("#mini-graph"),{mini:true}); M.setHidden(new Set());
  $("#info").innerHTML=infoDefault();
  $("#legend").innerHTML = Object.entries(TYPES).map(([k,v])=>`<label data-k="${k}" class="${hidden.has(k)?'off':''}"><span class="dot" style="background:${v.color}"></span>${U("types")[k]}</label>`).join("");
}
$("#info").addEventListener("click",e=>{ const o=e.target.closest("[data-open]"); if(o){ showProject(o.dataset.open); return; } const b=e.target.closest("[data-id]"); if(b) G.select(b.dataset.id,true); });
$("#legend").addEventListener("click",e=>{ const lb=e.target.closest("label"); if(!lb||lb.dataset.k==="person") return; const k=lb.dataset.k; hidden.has(k)?hidden.delete(k):hidden.add(k); lb.classList.toggle("off"); G.setHidden(hidden); });
$("#gsearch").addEventListener("input",e=>{ const q=e.target.value.trim().toLowerCase(); if(!q){G.select(null);return;} const h=G.nodes.find(n=>!n.hidden&&n.label.toLowerCase().includes(q)); if(h) G.select(h.id,true); });
$("#z-in").onclick=()=>G.zoom(1.2); $("#z-out").onclick=()=>G.zoom(.83); $("#z-fit").onclick=()=>{G.fit();G.select(null);};
const miniIds = DATA.projects.map(p=>p.id); let mi=0;
setInterval(()=>{ if(current==="home"&&M){ M.select(miniIds[mi%miniIds.length]); mi++; } }, 2200);

/* ---------------- COMMAND PALETTE ---------------- */
let cmdSel=0, cmdRes=[], CMD=[];
function buildCmd(){
  CMD = [
    ...VIEWS.map(([k,l])=>({label:U("goTo")(l), kind:U("page"), run:()=>go(k)})),
    ...DATA.projects.map(p=>({label:T(p.title), kind:U("projectK"), run:()=>showProject(p.id)})),
    ...DATA.publications.map(p=>({label:T(p.title), kind:U("kinds")[p.type], run:()=> WRITING_TYPES.includes(p.type) ? (cvtab="undergradWriting", renderCV(), go("about")) : (ptype=isPaper(p)?"papers":"presentation", renderPubs(), go("writing")) })),
    ...allThemes.map(t=>({label:theme(t), kind:U("theme"), run:()=>{ go("graph"); setTimeout(()=>G.select("t:"+t,true),120); }}))
  ];
}
function openCmd(){ buildCmd(); $("#cmdk").classList.add("on"); $("#cmdk-in").value=""; $("#cmdk-in").placeholder=U("cmdPh"); $("#cmdk-in").focus(); renderCmd(); }
function closeCmd(){ $("#cmdk").classList.remove("on"); }
function renderCmd(){ const q=$("#cmdk-in").value.trim().toLowerCase(); cmdRes = CMD.filter(i=>!q||i.label.toLowerCase().includes(q)||String(i.kind).toLowerCase().includes(q)).slice(0,12); cmdSel=0; paintCmd(); }
function paintCmd(){ $("#cmdk-list").innerHTML = cmdRes.length ? cmdRes.map((r,i)=>`<li><button data-i="${i}" class="${i===cmdSel?'on':''}">${esc(r.label)}<span class="k">${esc(r.kind)}</span></button></li>`).join("") : `<div class="empty">${U("noRes")}</div>`; }
$("#cmdk-in").addEventListener("input",renderCmd);
$("#cmdk-list").addEventListener("click",e=>{ const b=e.target.closest("button"); if(b){ closeCmd(); cmdRes[+b.dataset.i].run(); } });
$("#cmdk").addEventListener("click",e=>{ if(e.target.id==="cmdk") closeCmd(); });
$("#open-cmdk").addEventListener("click",openCmd);

/* ---------------- KEYBOARD ---------------- */
document.addEventListener("keydown",e=>{
  const open=$("#cmdk").classList.contains("on");
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="k"){ e.preventDefault(); open?closeCmd():openCmd(); return; }
  if(open){
    if(e.key==="Escape") closeCmd();
    if(e.key==="ArrowDown"){ e.preventDefault(); cmdSel=Math.min(cmdSel+1,cmdRes.length-1); paintCmd(); }
    if(e.key==="ArrowUp"){ e.preventDefault(); cmdSel=Math.max(cmdSel-1,0); paintCmd(); }
    if(e.key==="Enter"&&cmdRes[cmdSel]){ closeCmd(); cmdRes[cmdSel].run(); }
    return;
  }
  if(/input|textarea/i.test(document.activeElement.tagName)) return;
  if(e.key>="1"&&e.key<="5") go(VIEWS[+e.key-1][0]);
  if(e.key==="/"){ e.preventDefault(); openCmd(); }
  if(current==="work"&&(e.key==="ArrowRight"||e.key==="ArrowDown")){ e.preventDefault(); stepProject(1); }
  if(current==="work"&&(e.key==="ArrowLeft"||e.key==="ArrowUp")){ e.preventDefault(); stepProject(-1); }
});

/* ---------------- language ---------------- */
function setLang(l){
  LANG=l; try{ localStorage.setItem("lang",l); }catch(e){}
  document.documentElement.lang = l==="ko"?"ko":"en";
  document.title = l==="ko" ? "이원석, 디지털 헤리티지 포트폴리오" : "Wonseok Lee, Digital Heritage Portfolio";
  document.querySelectorAll("#lang button").forEach(b=>b.classList.toggle("on",b.dataset.l===l));
  document.querySelectorAll("[data-i18n]").forEach(el=>el.textContent=U(el.dataset.i18n));
  document.querySelectorAll("[data-i18n-html]").forEach(el=>el.innerHTML=U(el.dataset.i18nHtml));
  document.querySelectorAll("[data-i18n-ph]").forEach(el=>el.placeholder=U(el.dataset.i18nPh));
  renderHome(); renderWork(); renderPubs(); renderAbout(); renderMap();
}
$("#lang").addEventListener("click",e=>{ const b=e.target.closest("button"); if(b&&b.dataset.l!==LANG) setLang(b.dataset.l); });

/* ---------------- cursor + clock ---------------- */
const cur=$("#cursor");
document.addEventListener("pointermove",e=>{ cur.style.left=e.clientX+"px"; cur.style.top=e.clientY+"px"; cur.classList.toggle("big", !!e.target.closest("button,a,.tile,label,summary")); });
function tickClock(){ $("#clock").textContent = "Seoul " + new Intl.DateTimeFormat("en-GB",{timeZone:"Asia/Seoul",hour:"2-digit",minute:"2-digit",hour12:false}).format(new Date()); }
tickClock(); setInterval(tickClock, 20000);
$("#yr").textContent=new Date().getFullYear();

window.addEventListener("resize",()=>{ G&&G.resize(); M&&M.resize(); });
window.addEventListener("hashchange",()=>go(location.hash.slice(1)));
setLang(LANG);
go(location.hash.slice(1)||"home",{force:true});
</script>
</body>
